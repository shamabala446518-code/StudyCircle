<svg width="420" height="320" viewBox="0 0 420 320"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Background circle -->
    <circle cx="220" cy="160" r="135" fill="#EEF2FF"/>

    <!-- Decorative leaves -->
    <ellipse cx="90" cy="120" rx="25" ry="55"
             fill="#A7F3D0"
             transform="rotate(-35 90 120)"/>

    <ellipse cx="340" cy="130" rx="25" ry="55"
             fill="#BFDBFE"
             transform="rotate(35 340 130)"/>

    <!-- Bottom book -->
    <rect x="100" y="220"
          width="235" height="42"
          rx="10"
          fill="#F472B6"/>

    <rect x="105" y="212"
          width="225" height="42"
          rx="10"
          fill="#FFFFFF"/>

    <line x1="120" y1="230"
          x2="310" y2="230"
          stroke="#DBEAFE"
          stroke-width="4"/>


    <!-- Blue book -->
    <rect x="125" y="175"
          width="210" height="42"
          rx="9"
          fill="#2563EB"/>

    <rect x="120" y="168"
          width="210" height="42"
          rx="9"
          fill="#60A5FA"/>


    <!-- Purple book -->
    <rect x="145" y="130"
          width="190" height="42"
          rx="9"
          fill="#7C3AED"/>

    <rect x="140" y="123"
          width="190" height="42"
          rx="9"
          fill="#A78BFA"/>


    <!-- Graduation cap -->
    <polygon points="205,75 290,105 205,135 120,105"
             fill="#172554"/>

    <polygon points="205,75 290,105 205,120 120,105"
             fill="#1E3A8A"/>

    <!-- Cap base -->
    <rect x="165" y="108"
          width="80"
          height="28"
          rx="5"
          fill="#172554"/>

    <!-- Tassel -->
    <line x1="290" y1="105"
          x2="315" y2="135"
          stroke="#FBBF24"
          stroke-width="5"/>

    <circle cx="318" cy="138"
            r="7"
            fill="#FBBF24"/>


    <!-- Pencil holder -->
    <path d="M330 185 L390 185 L378 265 L342 265 Z"
          fill="#2563EB"/>

    <!-- Pencils -->
    <rect x="342" y="135"
          width="8"
          height="90"
          rx="4"
          fill="#F59E0B"
          transform="rotate(10 342 135)"/>

    <rect x="360" y="130"
          width="8"
          height="95"
          rx="4"
          fill="#EC4899"
          transform="rotate(18 360 130)"/>

    <rect x="378" y="140"
          width="8"
          height="90"
          rx="4"
          fill="#10B981"
          transform="rotate(25 378 140)"/>


    <!-- Light bulb -->
    <circle cx="335" cy="65"
            r="25"
            fill="#FBBF24"/>

    <path d="M323 87
             Q335 100 347 87"
          fill="none"
          stroke="#F59E0B"
          stroke-width="7"/>

    <!-- Light rays -->
    <line x1="335" y1="28"
          x2="335" y2="12"
          stroke="#FBBF24"
          stroke-width="5"/>

    <line x1="300" y1="38"
          x2="290" y2="25"
          stroke="#FBBF24"
          stroke-width="5"/>

    <line x1="370" y1="38"
          x2="380" y2="25"
          stroke="#FBBF24"
          stroke-width="5"/>

</svg>