
{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Upload File - StudyCircle</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="upload-page">

    <div class="upload-card">

        <div class="upload-icon">📁</div>

        <h1>Upload Study File</h1>

        <p class="subtitle">
            Upload and share important study materials with your study community.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>File Title</label>
            <input
                type="text"
                name="title"
                placeholder="Enter file title"
                required
            >

            <label>Select File</label>
            <input
                type="file"
                name="file"
                required
            >

            <button type="submit" class="upload-btn">
                Upload File →
            </button>

        </form>

        <a href="{% url 'resources' %}" class="back-btn">
            ← Back to Resources
        </a>

    </div>

</body>
</html>
