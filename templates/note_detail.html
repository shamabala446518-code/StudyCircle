<!DOCTYPE html>
<html>

<head>

    <title>{{ note.title }} - StudyCircle</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8f7ff, #eef4ff);
            color: #172554;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main card */

        .note-detail {
            width: 100%;
            max-width: 800px;

            background: white;

            padding: 45px;

            border-radius: 22px;

            box-shadow: 0 15px 40px rgba(30, 41, 59, 0.12);

            text-align: center;
        }

        /* Icon */

        .note-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #ede9fe,
                #dbeafe
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        /* Title */

        h1 {
            font-size: 36px;
            margin-bottom: 20px;

            background: linear-gradient(
                90deg,
                #6c2ff2,
                #2563eb
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Content */

        .note-content {
            background: #f8f7ff;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 30px;

            color: #475569;

            font-size: 17px;

            line-height: 1.7;

            text-align: left;
        }

        /* Back button */

        .back-btn {
            display: inline-block;

            padding: 12px 28px;

            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #6c2ff2,
                #2563eb
            );

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(108, 47, 242, 0.25);
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .note-detail {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .note-content {
                font-size: 15px;
            }
            .note-content {
    color: #475569;
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
}

        }

    </style>

</head>


<body>

    <div class="note-detail">

        <!-- Note Icon -->

        <div class="note-icon">
            📚
        </div>


        <!-- Note Title -->

        <h1>
            {{ note.title }}
        </h1>


        <!-- Note Content -->

        <div class="note-content">

            
                {{ note.content }}
            

        </div>


        <!-- Back Button -->

        <a href="/notes/" class="back-btn">
            ← Back to Notes
        </a>

    </div>

</body>

</html>
